listen 1935;
max_connections 200;
daemon off;

http_api {
    enabled on;
    listen 1985;
}

http_server {
    enabled on;
    listen 8080;
    dir /data/hls;
}

vhost __defaultVhost__ {
    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
    }
    hls {
        enabled on;
        hls_path /data/hls;
        # fragment 4→2：配合前端 hls.js liveSyncDurationCount=2，Safari 兑底路径延迟约 12s → 6~8s；
        # 主播端 Chrome/Edge 走 HTTP-FLV（mpegts.js）不受此参数影响。
        hls_fragment 2;
        hls_window 30;
    }
    dvr {
        enabled on;
        dvr_path /data/recordings/[stream]-[timestamp].mp4;
        dvr_plan session;
        dvr_duration 0;
    }
    http_hooks {
        enabled on;
        on_publish http://api:3000/api/webhooks/srs;
        on_unpublish http://api:3000/api/webhooks/srs;
        on_dvr http://api:3000/api/webhooks/srs;
    }
}
