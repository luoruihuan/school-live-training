listen 1935;
max_connections 200;
daemon off;

http_api {
    enabled on;
    listen 1985;
}

http_server {
    enabled on;
    listen 8080;
    dir /data/hls;
}

vhost __defaultVhost__ {
    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
    }
    hls {
        enabled on;
        hls_path /data/hls;
        hls_fragment 4;
        hls_window 30;
    }
    dvr {
        enabled on;
        dvr_path /data/recordings/[stream]-[timestamp].mp4;
        dvr_plan session;
        dvr_duration 0;
    }
    http_hooks {
        enabled on;
        on_publish http://api:3000/api/webhooks/srs;
        on_unpublish http://api:3000/api/webhooks/srs;
        on_dvr http://api:3000/api/webhooks/srs;
    }
}
