name: live-training

x-api-environment: &api-environment
  DATABASE_URL: mysql://live:${MYSQL_PASSWORD:?设置 MYSQL_PASSWORD}@mysql:3306/live_training
  COOKIE_SECURE: "true"
  APP_DOMAIN: ${APP_DOMAIN:?设置业务域名}
  APP_ORIGIN: https://${APP_DOMAIN:?设置业务域名}
  SRS_SECRET: ${SRS_SECRET:?设置 SRS 推流鉴权密钥}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?设置 MinIO 用户}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?设置 MinIO 密码}
  # 回放长期层（可选）：配置后回放存腾讯 COS（同地域内网免流量费），商品图仍走 MinIO；
  # 清空以下变量即可回退到 MinIO 存储（回滚开关）
  COS_ENDPOINT: ${COS_ENDPOINT:-}
  COS_REGION: ${COS_REGION:-ap-tokyo}
  COS_SECRET_ID: ${COS_SECRET_ID:-}
  COS_SECRET_KEY: ${COS_SECRET_KEY:-}
  COS_RECORDINGS_BUCKET: ${COS_RECORDINGS_BUCKET:-}
  RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-180}
  # CDN 分发（可选，全部留空即回退直连源站）：
  #  CDN_LIVE_DOMAIN：直播加速域名，回源 https://APP_DOMAIN/live/*（FLV/HLS）；
  #  REPLAY_CDN_DOMAIN：回放加速域名（绑 COS 桶），回放改直连 CDN，不再经 API 代理；
  #  CDN_URL_AUTH_KEY：回放 URL 鉴权密钥，需与 CDN 控制台 TypeA 主密钥一致。
  CDN_LIVE_DOMAIN: ${CDN_LIVE_DOMAIN:-}
  REPLAY_CDN_DOMAIN: ${REPLAY_CDN_DOMAIN:-}
  CDN_URL_AUTH_KEY: ${CDN_URL_AUTH_KEY:-}
  RECORDING_MIN_RETENTION_DAYS: ${RECORDING_MIN_RETENTION_DAYS:-90}
  FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: live_training
      MYSQL_USER: live
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?设置 MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -ulive -Dlive_training -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *logging

  initialize:
    build:
      context: .
      target: initialize
    environment:
      DATABASE_URL: mysql://live:${MYSQL_PASSWORD:?设置 MYSQL_PASSWORD}@mysql:3306/live_training
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?设置管理员邮箱}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?设置管理员密码}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    environment: *api-environment
    volumes:
      - srs_recordings:/var/srs-recordings
    depends_on:
      initialize:
        condition: service_completed_successfully
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging: *logging

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?设置业务域名}
      NGINX_ENVSUBST_FILTER: ^APP_DOMAIN$
    ports:
      - "${WEB_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${WEB_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_DIR:-./deploy/tls}:/etc/nginx/tls:ro
      - ./deploy/acme:/var/www/acme:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/healthz >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging: *logging

  srs:
    image: ossrs/srs:6
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:1935:1935"
    volumes:
      - ./deploy/srs/srs.conf:/usr/local/srs/conf/docker.conf:ro
      - srs_recordings:/data/recordings
      - srs_hls:/data/hls
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ls /usr/local/srs/objs >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  minio:
    # MinIO 社区版已归档且 Docker Hub 镜像下架；silo 为其直接延续版，
    # S3 API / MINIO_ROOT_* 环境变量 / 命令行完全兼容（https://pgsty.com/silo）
    image: docker.io/pgsty/silo:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # 仅绑定本机回环：供宿主机 rclone 备份访问，替代不稳定的容器动态 IP；不暴露公网
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?设置 MinIO 用户}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?设置 MinIO 密码}
    volumes:
      - minio_data:/data
    logging: *logging

volumes:
  mysql_data:
  srs_recordings:
  srs_hls:
  minio_data:

