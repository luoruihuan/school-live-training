name: live-training

x-api-environment: &api-environment
  DATABASE_URL: mysql://live:${MYSQL_PASSWORD:?设置 MYSQL_PASSWORD}@mysql:3306/live_training
  COOKIE_SECURE: "true"
  APP_ORIGIN: https://${APP_DOMAIN:?设置业务域名}
  TENCENT_PUSH_DOMAIN: ${TENCENT_PUSH_DOMAIN:-}
  TENCENT_PLAY_DOMAIN: ${TENCENT_PLAY_DOMAIN:-}
  TENCENT_STREAM_APP: ${TENCENT_STREAM_APP:-live}
  TENCENT_PUSH_KEY: ${TENCENT_PUSH_KEY:-}
  TENCENT_PLAY_KEY: ${TENCENT_PLAY_KEY:-}
  TENCENT_CALLBACK_KEY: ${TENCENT_CALLBACK_KEY:-}
  COS_BUCKET: ${COS_BUCKET:-}
  COS_REGION: ${COS_REGION:-ap-guangzhou}
  COS_SECRET_ID: ${COS_SECRET_ID:-}
  COS_SECRET_KEY: ${COS_SECRET_KEY:-}
  RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-30}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: live_training
      MYSQL_USER: live
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?设置 MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -ulive -Dlive_training -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *logging

  initialize:
    build:
      context: .
      target: initialize
    environment:
      DATABASE_URL: mysql://live:${MYSQL_PASSWORD:?设置 MYSQL_PASSWORD}@mysql:3306/live_training
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?设置管理员邮箱}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?设置管理员密码}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    environment: *api-environment
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging: *logging

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?设置业务域名}
      NGINX_ENVSUBST_FILTER: ^APP_DOMAIN$
    ports:
      - "${WEB_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${WEB_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_DIR:-./deploy/tls}:/etc/nginx/tls:ro
      - ./deploy/acme:/var/www/acme:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/healthz >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging: *logging

volumes:
  mysql_data:

